services:
  - type: web
    name: ecograph
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ECO_LLM_PROVIDER
        value: gemini
      - key: ECO_LLM_API_KEY
        sync: false
      - key: ECO_ASK_PER_MIN
        value: "6"
      - key: ECO_ASK_PER_DAY
        value: "200"
